<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Discord Webhook Sender</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }
    .field {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 15px;
      background-color: #5865F2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #4752C4;
    }
  </style>
</head>
<body>

  <h2>Discord Webhook Sender</h2>

  <form id="webhookForm">
    <div class="field">
      <label for="webhookUrl">Discord Webhook URL:</label>
      <input 
        type="text" 
        id="webhookUrl" 
        placeholder="https://discord.com/api/webhooks/..." 
        required 
      />
    </div>

    <div class="field">
      <label for="username">Custom Username (Optional):</label>
      <input 
        type="text" 
        id="username" 
        placeholder="e.g. My Website Bot" 
      />
    </div>

    <div class="field">
      <label for="userMessage">Message:</label>
      <textarea 
        id="userMessage" 
        rows="4" 
        placeholder="Type your message here..." 
        required
      ></textarea>
    </div>

    <button type="submit">Send Message</button>
  </form>

  <script>
    const form = document.getElementById("webhookForm");
    const webhookInput = document.getElementById("webhookUrl");

    // Automatically load saved webhook URL if available in local storage
    if (localStorage.getItem("discord_webhook_url")) {
      webhookInput.value = localStorage.getItem("discord_webhook_url");
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const webhookUrl = webhookInput.value.trim();
      const username = document.getElementById("username").value.trim();
      const message = document.getElementById("userMessage").value.trim();

      // Save the webhook URL locally in the user's browser for convenience
      localStorage.setItem("discord_webhook_url", webhookUrl);

      // Build the JSON payload for Discord
      const payload = {
        content: message
      };

      if (username !== "") {
        payload.username = username;
      }

      // Send the HTTP request to Discord
      fetch(webhookUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(response => {
        if (response.ok) {
          alert("Message sent successfully!");
          document.getElementById("userMessage").value = "";
        } else {
          alert("Failed to send message. Please double-check your Webhook URL.");
        }
      })
      .catch(error => {
        console.error("Error:", error);
        alert("An error occurred while attempting to send the message.");
      });
    });
  </script>

</body>
</html>
